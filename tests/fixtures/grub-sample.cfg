set default="0"
set timeout=5

menuentry "Debian GNU/Linux - live" {
  linux /live/vmlinuz-6.8.0-41-generic boot=casper quiet splash ---
  initrd /live/initrd.img-6.8.0-41-generic
}

menuentry "Debian GNU/Linux - live (fail-safe mode)" {
  linux /live/vmlinuz-6.8.0-41-generic boot=casper nomodeset quiet splash ---
  initrd /live/initrd.img-6.8.0-41-generic
}

menuentry "Debian GNU/Linux - live, kernel 6.8.0-41-generic (fail-safe mode)" {
  linux /live/vmlinuz-6.8.0-41-generic boot=casper nomodeset quiet splash ---
  initrd /live/initrd.img-6.8.0-41-generic
}
