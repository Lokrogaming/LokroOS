# LokroOS Plymouth Boot-Splash (Phase 1 von 3: Boot → Login → Welcome)
# Pfad auf Zielsystem: /etc/plymouth/plymouthd.conf + Theme unter
# /usr/share/plymouth/themes/lokroos/
[Daemon]
Theme=lokroos
ShowDelay=0
DeviceTimeout=8
# Theme-Prinzip: schwarzer Hintergrund (#06090F), LOKRO-Logo, dezenter
# Cyan-Glow-Spinner, keine Neon-Übertreibung. Textlos (kein Passwort je sichtbar).
