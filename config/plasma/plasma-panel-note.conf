# LokroOS Plasma-Panel-Regel: Kein Doppel-Panel mit LokroOS-Taskbar.
# Der Installer aktiviert das Profil "lokroos" (ein Panel, Auto-Hide),
# die LokroOS-Taskbar (QML) läuft als einziges Dock.
# Datei: config/plasma/plasma-org.kde.plasma.desktop-appletsrc (Auszug)
[PlasmaViews][Panel]
alignment=0
visibility=2
# visibility: 0=AlwaysVisible 1=AutoHide 2=WindowsCanCover 3=WindowsGoBelow
# LokroOS nutzt AutoHide (1), damit Taskbar.qml nicht konkurriert.
