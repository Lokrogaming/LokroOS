# LokroOS SDDM-Konfiguration (Login-Bildschirm, Phase 2 von 3: Boot → Login → Welcome)
# Pfad auf Zielsystem: /etc/sddm.conf.d/lokroos.conf
[Theme]
Current=lokroos-sddm
CursorTheme=breeze_cursors

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Users]
MaximumUid=60000
MinimumUid=1000
HideUsers=
# Hinweis: KEIN Autologin mit gespeicherten Passwörtern. Welcome-Overlay
# (lokroos-welcome.py) läuft erst NACH erfolgreichem Login via Autostart.
